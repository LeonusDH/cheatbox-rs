name: release

# Только вручную (Actions → release → Run workflow), чтобы не тратить лимиты на каждый коммит.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  bin: cheatbox }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, bin: cheatbox, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     bin: cheatbox.exe }
          - { os: macos-latest,   target: aarch64-apple-darwin,       bin: cheatbox }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.cross
        run: cargo install cross --locked
      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cheatbox-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
