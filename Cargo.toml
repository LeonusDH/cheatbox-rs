[package]
name = "cheatbox"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Cheatsheets in a bento box — Rust port of fatinul/cheatbox, with MOTD mode"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["cheatsheet", "terminal", "motd", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
include_dir = "0.7"
unicode-width = "0.2"
terminal_size = "0.4"
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }
fastrand = "2"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
